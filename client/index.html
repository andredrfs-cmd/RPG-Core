<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG-Core</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="nameScreen" class="is-hidden">
    <section id="nameCard" aria-labelledby="nameTitle">
      <h2 id="nameTitle">Entrar no RPG-Core</h2>
      <p>Escolha o nome que aparecerá para os outros jogadores.</p>
      <form id="nameForm">
        <label for="nameInput" hidden>Nome do jogador</label>
        <input id="nameInput" name="name" type="text" maxlength="16" autocomplete="nickname" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="nameError" role="alert"></p>
    </section>
  </div>

  <main>
    <h1>RPG-Core</h1>
    <p id="status">Conectando ao servidor...</p>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <p class="help">Movimente-se com WASD ou as setas. A câmera acompanha o jogador local.</p>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
