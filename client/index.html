<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG-Core</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10131a;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    main { width: min(94vw, 860px); text-align: center; }
    h1 { margin: 0 0 8px; }
    #status { color: #aab4c4; margin: 0 0 14px; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 3px solid #344054;
      background: #080a0f;
      image-rendering: pixelated;
    }
    .help { color: #aab4c4; font-size: .9rem; }
    #nameScreen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(8, 10, 15, .88);
      z-index: 2;
    }
    #nameCard {
      width: min(100%, 380px);
      padding: 28px;
      border: 1px solid #344054;
      border-radius: 12px;
      background: #171c27;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    }
    #nameCard h2 { margin-top: 0; }
    #nameForm { display: flex; gap: 8px; }
    #nameInput {
      min-width: 0;
      flex: 1;
      padding: 11px;
      border: 1px solid #52617a;
      border-radius: 6px;
      background: #0f131b;
      color: #fff;
      font: inherit;
    }
    #nameForm button {
      padding: 11px 16px;
      border: 0;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    #nameForm button:disabled { opacity: .55; cursor: wait; }
    #nameError { min-height: 1.4em; margin-bottom: 0; color: #ff8787; }
  </style>
</head>
<body>
  <div id="nameScreen" hidden>
    <section id="nameCard" aria-labelledby="nameTitle">
      <h2 id="nameTitle">Entrar no RPG-Core</h2>
      <p>Escolha o nome que aparecerá para os outros jogadores.</p>
      <form id="nameForm">
        <label for="nameInput" hidden>Nome do jogador</label>
        <input id="nameInput" name="name" type="text" maxlength="16" autocomplete="nickname" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="nameError" role="alert"></p>
    </section>
  </div>

  <main>
    <h1>RPG-Core</h1>
    <p id="status">Conectando ao servidor...</p>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <p class="help">Movimente-se com WASD ou as setas. Abra este link em outra aba para testar o multiplayer.</p>
  </main>

  <script>
    const canvas = document.querySelector('#gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusElement = document.querySelector('#status');
    const nameScreen = document.querySelector('#nameScreen');
    const nameForm = document.querySelector('#nameForm');
    const nameInput = document.querySelector('#nameInput');
    const nameError = document.querySelector('#nameError');
    const nameButton = nameForm.querySelector('button');
    const inputs = { up: false, down: false, left: false, right: false };
    let socket;
    let myPlayerId = null;
    let myPlayerName = null;
    let hasEnteredWorld = false;
    let players = [];
    let world = { width: canvas.width, height: canvas.height };

    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${window.location.host}`);

      socket.addEventListener('open', () => {
        statusElement.textContent = 'Conectado — escolha um nome para entrar';
        statusElement.style.color = '#63e6be';
      });

      socket.addEventListener('message', (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'INIT') {
          myPlayerId = data.id;
          world = data.world || world;
          nameInput.value = data.suggestedName || data.id;
          nameScreen.hidden = false;
          nameInput.focus();
        }

        if (data.type === 'NAME_ERROR') {
          nameError.textContent = data.message;
          nameButton.disabled = false;
          nameInput.focus();
          nameInput.select();
        }

        if (data.type === 'NAME_ACCEPTED') {
          myPlayerId = data.id;
          myPlayerName = data.name;
          hasEnteredWorld = true;
          nameScreen.hidden = true;
          statusElement.textContent = `Conectado como ${myPlayerName} — jogadores: ${players.length}`;
        }

        if (data.type === 'TICK_UPDATE') {
          players = data.players;
          world = data.world || world;
          if (hasEnteredWorld) {
            statusElement.textContent = `Conectado como ${myPlayerName} — jogadores: ${players.length}`;
          }
        }
      });

      socket.addEventListener('close', () => {
        statusElement.textContent = 'Desconectado do servidor';
        statusElement.style.color = '#ff8787';
        nameButton.disabled = true;
      });

      socket.addEventListener('error', () => {
        statusElement.textContent = 'Erro ao conectar ao servidor';
        statusElement.style.color = '#ff8787';
      });
    }

    nameForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name || !socket || socket.readyState !== WebSocket.OPEN) return;

      nameError.textContent = '';
      nameButton.disabled = true;
      socket.send(JSON.stringify({ type: 'SET_NAME', name }));
    });

    function sendInputs() {
      if (socket && socket.readyState === WebSocket.OPEN && hasEnteredWorld) {
        socket.send(JSON.stringify({ type: 'INPUT', inputs }));
      }
    }

    function updateInput(key, pressed) {
      const normalized = key.toLowerCase();
      const mapping = {
        w: 'up', arrowup: 'up',
        s: 'down', arrowdown: 'down',
        a: 'left', arrowleft: 'left',
        d: 'right', arrowright: 'right'
      };
      const direction = mapping[normalized];
      if (!direction || inputs[direction] === pressed) return;
      inputs[direction] = pressed;
      sendInputs();
    }

    window.addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
      updateInput(event.key, true);
    });
    window.addEventListener('keyup', (event) => updateInput(event.key, false));
    window.addEventListener('blur', () => {
      Object.keys(inputs).forEach((key) => inputs[key] = false);
      sendInputs();
    });

    function render() {
      ctx.fillStyle = '#080a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#171c27';
      ctx.lineWidth = 1;
      for (let x = 0; x <= world.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, world.height); ctx.stroke();
      }
      for (let y = 0; y <= world.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(world.width, y); ctx.stroke();
      }

      players.forEach((player) => {
        const size = 30;
        const left = player.x - size / 2;
        const top = player.y - size / 2;
        ctx.fillStyle = player.color;
        ctx.fillRect(left, top, size, size);

        if (player.id === myPlayerId) {
          ctx.strokeStyle = '#7dff7d';
          ctx.lineWidth = 3;
          ctx.strokeRect(left - 2, top - 2, size + 4, size + 4);
        }

        ctx.fillStyle = '#fff';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(player.name || player.id, player.x, top - 8);
      });

      requestAnimationFrame(render);
    }

    connect();
    render();
  </script>
</body>
</html>
